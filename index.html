<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH_EXAM v2.9 - Grade 10 Full Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0ea5e9; --bg: #0f172a; }
        body { background: var(--bg); color: #f1f5f9; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .font-tech { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-tech { transition: all 0.3s; border: 1px solid rgba(14, 165, 233, 0.3); cursor: pointer; }
        .btn-tech:hover:not(:disabled) { background: var(--primary); color: white; box-shadow: 0 0 20px var(--primary); }
        .hidden { display: none; }
        .active-tf { background: #0ea5e9 !important; color: white !important; border-color: #38bdf8 !important; }
        .correct-tf { background: #059669 !important; color: white !important; }
        .wrong-tf { background: #dc2626 !important; color: white !important; }
        .selected-mc { background: rgba(14, 165, 233, 0.3); border-color: #0ea5e9; color: white; }
        #timer-display.low-time { color: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .section-header { border-left: 4px solid #0ea5e9; padding-left: 1rem; margin: 2rem 0 1.5rem 0; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto flex justify-between items-center mb-8">
        <div>
            <h1 class="font-tech text-2xl text-sky-400 tracking-tighter">TECH_EXAM v2.9</h1>
            <p id="grade-display" class="text-xs text-slate-500 uppercase tracking-widest font-semibold">Hệ thống ôn tập Công nghệ</p>
        </div>
        <div id="timer-container" class="hidden glass px-6 py-2 rounded-full border border-sky-500/50">
            <span class="text-xs text-slate-400 uppercase mr-2 font-bold">Thời gian:</span>
            <span id="timer-display" class="font-tech text-xl text-sky-400">25:00</span>
        </div>
    </div>

    <div class="max-w-4xl mx-auto">
        <div id="screen-1" class="text-center py-12">
            <h2 class="text-3xl font-bold mb-10">Chọn Khối Lớp</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-md mx-auto">
                <button onclick="selectGrade(10)" class="btn-tech glass p-8 rounded-2xl text-xl font-bold">KHỐI 10</button>
                <button onclick="selectGrade(11)" class="btn-tech glass p-8 rounded-2xl text-xl font-bold">KHỐI 11</button>
            </div>
        </div>

        <div id="screen-2" class="hidden text-center py-12">
            <h2 id="screen-2-title" class="text-3xl font-bold mb-10 text-sky-400 uppercase">CHỌN HÌNH THỨC</h2>
            <div id="type-options" class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto"></div>
            <button onclick="goScreen(1)" class="mt-8 text-slate-500 hover:text-white transition-colors">← Quay lại</button>
        </div>

        <div id="screen-3" class="hidden">
            <div id="quiz-container" class="space-y-8 mb-32"></div>
            <div class="fixed bottom-0 left-0 w-full glass p-4 flex justify-center border-t border-sky-500/30 z-50">
                <button id="submit-btn" onclick="confirmSubmit()" class="bg-sky-600 hover:bg-sky-500 text-white px-12 py-3 rounded-xl font-bold uppercase tracking-widest transition-all">Nộp Bài</button>
            </div>
        </div>

        <div id="screen-4" class="hidden text-center py-12">
            <h2 class="font-tech text-4xl text-sky-400 mb-6 uppercase tracking-tighter">Kết quả bài làm</h2>
            <div class="glass p-10 rounded-3xl inline-block mb-8 min-w-[240px]">
                <p id="score-text" class="text-7xl font-bold text-white">0.00</p>
                <p class="text-slate-400 mt-2 font-semibold tracking-widest uppercase text-xs">Điểm số (x 0.25đ/ý)</p>
                <p id="detail-text" class="text-sm text-sky-400 mt-4 font-mono bg-sky-950/30 py-2 px-4 rounded-lg">Đúng 0 câu/ý</p>
            </div>
            <div class="flex flex-col items-center gap-4">
                <button onclick="showReview()" class="bg-emerald-600 hover:bg-emerald-500 px-10 py-3 rounded-full font-bold w-64 transition-all">XEM LẠI ĐÁP ÁN</button>
                <button onclick="location.reload()" class="btn-tech glass px-10 py-3 rounded-full font-bold w-64 transition-all">LÀM ĐỀ KHÁC</button>
            </div>
        </div>
    </div>

    <script>
        const questionsDB = {
            10: {
                multiple: [{ question: "Vẽ kĩ thuật có vai trò gì trong đời sống?", options: ["Sử dụng sản phẩm hiệu quả và an toàn", "Để chế tạo sản phẩm", "Để lắp ráp sản phẩm", "Để kiểm tra sản phẩm"], answer: 0 }],
                tf: [
                    { q: "Trong quy trình thiết kế kĩ thuật, hãy xác định tính Đúng hoặc Sai của các phát biểu sau:", sub: [{ t: "Quy trình thiết kế kĩ thuật là một tiến trình tuyến tính đi theo đường thẳng từ bước đầu tiên đến bước cuối cùng mà không cần quay lại các bước trước đó.", a: "S" }, { t: "Bước 'Xây dựng nguyên mẫu cho giải pháp' (Bước 5) được thực hiện sau khi đã đề xuất, đánh giá và lựa chọn được giải pháp tối ưu nhất.", a: "Đ" }, { t: "Việc tìm hiểu tổng quan giúp người thiết kế tránh được các sai lầm đã có và thừa hưởng kinh nghiệm của người khác trong các giải pháp tương tự.", a: "Đ" }, { t: "Hồ sơ kĩ thuật của sản phẩm chỉ bao gồm bản vẽ chi tiết và không cần các tài liệu như thuyết minh hay hướng dẫn sử dụng.", a: "S" }] },
                    { q: "Đối với các nguyên tắc tối ưu và phát triển bền vững trong thiết kế, các nhận định sau đây là đúng hay sai?", sub: [{ t: "Nguyên tắc đơn giản hoá khuyến khích người thiết kế lựa chọn phương án có kết cấu phức tạp để thể hiện trình độ công nghệ cao của sản phẩm.", a: "S" }, { t: "Nguyên tắc tối thiểu tài chính nhằm mục tiêu tạo ra sản phẩm chất lượng tốt nhất trong điều kiện nguồn lực tài chính hữu hạn.", a: "Đ" }, { t: "Nguyên tắc tiết kiệm tài nguyên chỉ tập trung vào việc sử dụng ít vật liệu mà không cần quan tâm đến việc sử dụng năng lượng tái tạo.", a: "S" }, { t: "Quy tắc 6R (bao gồm Recycle, Reduce, Rethink, Repair, Reuse, Refuse) là nội dung cốt lõi của nguyên tắc bảo vệ môi trường trong thiết kế bền vững.", a: "Đ" }] },
                    { q: "Trong bản vẽ kĩ thuật, quy ước biểu diễn ren được quy định rất chặt chẽ. Hãy xác định tính Đúng hoặc Sai của các nhận định sau:", sub: [{ t: "Đối với ren nhìn thấy, đường đỉnh ren và đường giới hạn ren đều được vẽ bằng nét liền đậm.", a: "Đ" }, { t: "Vòng chân ren của ren nhìn thấy được quy định vẽ hở khoảng 1/4 vòng và sử dụng nét liền mảnh.", a: "Đ" }, { t: "Đối với ren bị che khuất, đường đỉnh ren được vẽ bằng nét đứt mảnh còn đường chân ren vẫn vẽ bằng nét liền mảnh.", a: "S" }, { t: "Đường chân ren của ren nhìn thấy được vẽ bằng nét liền đậm để phân biệt rõ với đường đỉnh ren.", a: "S" }] },
                    { q: "Dựa trên kiến thức về các loại ren và cách kí hiệu, hãy cho biết các phát biểu sau đây là đúng hay sai:", sub: [{ t: "Ren ngoài (hay còn gọi là ren trục) là loại ren được hình thành ở mặt trong của lỗ chi tiết.", a: "S" }, { t: "Ren không chỉ dùng để ghép nối các chi tiết máy mà còn được dùng để truyền chuyển động (ví dụ như ở trục vít của ê tô).", a: "Đ" }, { t: "Kí hiệu 'M' dùng để chỉ ren hệ mét, 'Sq' dùng cho ren vuông và 'Tr' dùng cho ren thang.", a: "Đ" }, { t: "Để hai chi tiết có ren lắp ghép được với nhau, chúng chỉ cần có cùng đường kính ren mà không cần quan tâm đến bước ren hay dạng ren.", a: "S" }] },
                    { q: "Bản vẽ chi tiết là tài liệu kĩ thuật quan trọng trong sản xuất cơ khí. Hãy xác định tính Đúng hoặc Sai của các nhận định sau:", sub: [{ t: "Một bản vẽ chi tiết đầy đủ phải bao gồm 4 nội dung chính: hình biểu diễn, kích thước, yêu cầu kĩ thuật và khung tên.", a: "Đ" }, { t: "Yêu cầu kĩ thuật trên bản vẽ chi tiết chỉ bao gồm các chỉ dẫn về vật liệu mà không cần các chỉ dẫn về gia công hay xử lí bề mặt.", a: "S" }, { t: "Bản vẽ chi tiết được dùng làm căn cứ để chế tạo và kiểm tra chi tiết máy.", a: "Đ" }, { t: "Bảng kê là một thành phần bắt buộc phải có trong nội dung của mọi bản vẽ chi tiết.", a: "S" }] },
                    { q: "Bản vẽ lắp thể hiện hình dạng và vị trí tương quan của một nhóm chi tiết. Hãy cho biết các phát biểu sau đây là đúng hay sai:", sub: [{ t: "Bản vẽ lắp được sử dụng chủ yếu làm tài liệu cho việc lắp ráp, điều chỉnh, vận hành và kiểm tra sản phẩm.", a: "Đ" }, { t: "Kích thước chung trên bản vẽ lắp là loại kích thước xác định tổng chiều dài, chiều rộng và chiều cao của toàn bộ sản phẩm.", a: "Đ" }, { t: "Bảng kê trong bản vẽ lắp thường liệt kê các thông tin như số thứ tự, tên gọi chi tiết, số lượng và vật liệu chế tạo.", a: "Đ" }, { t: "Khi đọc bản vẽ lắp, người thợ có thể dựa vào đó để biết chính xác các yêu cầu kĩ thuật riêng biệt như độ nhám bề mặt của từng chi tiết đơn lẻ.", a: "S" }] },
                    { q: "Trong bản vẽ nhà, mỗi loại hình biểu diễn có một vai trò riêng. Hãy xác định tính Đúng hoặc Sai của các nhận định sau:", sub: [{ t: "Mặt bằng là hình cắt bằng với mặt phẳng cắt nằm ngang đi qua các cửa sổ (cách mặt sàn khoảng 1,5 m) để thể hiện cách bố trí phòng xá và đồ đạc.", a: "Đ" }, { t: "Mặt đứng là hình chiếu thẳng góc của ngôi nhà lên mặt phẳng thẳng đứng nhằm thể hiện hình dáng kiến trúc bên ngoài.", a: "Đ" }, { t: "Mặt cắt là hình cắt thu được khi dùng mặt phẳng cắt tưởng tượng thẳng đứng cắt qua không gian trống của ngôi nhà để thể hiện kết cấu và chiều cao các tầng.", a: "Đ" }, { t: "Hình chiếu phối cảnh của ngôi nhà thường không có giá trị thực tế và chỉ được dùng để trang trí cho bản vẽ thêm đẹp mắt.", a: "S" }] },
                    { q: "Dựa trên kiến thức về bản vẽ xây dựng và các quy ước kèm theo, hãy cho biết các phát biểu sau đây là đúng hay sai:", sub: [{ t: "Quá trình thiết kế một công trình xây dựng thường trải qua ba giai đoạn: thiết kế phương án, thiết kế kĩ thuật và thiết kế thi công.", a: "Đ" }, { t: "Bản vẽ mặt bằng tổng thể thể hiện vị trí các công trình với hệ thống đường sá, cây xanh... trên khu đất xây dựng.", a: "Đ" }, { t: "Trong bản vẽ nhà, các bộ phận cấu tạo như cửa đi, cửa sổ, cầu thang được thể hiện bằng các kí hiệu quy ước thay vì vẽ chi tiết thực tế.", a: "Đ" }, { t: "Khi đọc bản vẽ mặt bằng, nếu mặt phẳng cắt đi dọc theo chiều dài của ngôi nhà thì ta sẽ thu được một mặt đứng của ngôi nhà đó.", a: "S" }] },
                    { q: "Việc sử dụng phần mềm CAD mang lại nhiều lợi ích và tuân theo một quy trình nhất định. Hãy xác định tính Đúng hoặc Sai của các nhận định sau:", sub: [{ t: "Một trong những ưu điểm cơ bản của việc lập bản vẽ bằng máy tính là bản vẽ được lập một cách chính xác và nhanh chóng.", a: "Đ" }, { t: "Quy trình thực hiện thiết lập bản vẽ bằng máy tính bắt đầu bằng việc phân tích bản vẽ và kết thúc bằng việc thiết lập các thông số ban đầu.", a: "S" }, { t: "Các phần mềm CAD (Computer-Aided Design) có thể hỗ trợ đa ngành nghề như cơ khí, xây dựng, kiến trúc.", a: "Đ" }, { t: "Bản vẽ điện tử bằng máy tính thường khó sửa chữa và lưu trữ hơn so với bản vẽ tay truyền thống.", a: "S" }] },
                    { q: "Về giao diện và các chức năng hỗ trợ trong AutoCAD (Bài 16). Hãy cho biết các phát biểu sau đây là đúng hay sai:", sub: [{ t: "Vùng đồ hoạ là vùng không gian lớn nhất ở trung tâm màn hình, hiển thị nội dung của bản vẽ, hệ toạ độ và con trỏ.", a: "Đ" }, { t: "Chức năng bắt điểm tự động (OSNAP) giúp cho việc vẽ được chính xác bằng cách xác định các điểm đặc biệt như điểm đầu, cuối, trung điểm.", a: "Đ" }, { t: "Chức năng định hướng trục Ox và Oy (Ortho) khi được bật sẽ cho phép con trỏ di chuyển tự do theo mọi góc độ để vẽ đường xiên.", a: "S" }, { t: "Chức năng thu, phóng màn hình (Zoom) dùng để thay đổi kích thước thực tế của vật thể trong bản vẽ để phục vụ in ấn.", a: "S" }] },
                    { q: "Hoạt động thiết kế kĩ thuật có những đặc điểm và quy trình cụ thể để giải quyết các vấn đề thực tiễn. Hãy xác định tính Đúng hoặc Sai của các nhận định sau:", sub: [{ t: "Thiết kế kĩ thuật là hoạt động đặc thù của các kĩ sư nhằm phát hiện và giải quyết vấn đề, đáp ứng nhu cầu trên cơ sở vận dụng toán học, khoa học tự nhiên và công nghệ.", a: "Đ" }, { t: "Quy trình thiết kế kĩ thuật chỉ bao gồm việc vẽ hình dáng sản phẩm mà không cần các bước thử nghiệm, đánh giá hay điều chỉnh giải pháp.", a: "S" }, { t: "Thiết kế kĩ thuật giúp con người nhìn nhận vấn đề dưới góc nhìn tổng thể, mang tính hệ thống và rèn luyện tư duy nhạy bén.", a: "Đ" }, { t: "Thiết kế kĩ thuật và thiết kế mĩ thuật là hai khái niệm hoàn toàn giống nhau vì đều tập trung vào việc tạo ra vẻ đẹp.", a: "S" }] },
                    { q: "Thiết kế kĩ thuật đóng vai trò quan trọng trong xã hội và gắn liền với nhiều ngành nghề. Hãy cho biết các phát biểu sau đây là đúng hay sai:", sub: [{ t: "Thiết kế kĩ thuật đóng vai trò phát triển sản phẩm, giúp cải tiến các sản phẩm hiện có và tạo ra sản phẩm mới.", a: "Đ" }, { t: "Nhà thiết kế sản phẩm (Industrial Designer) là người chuyên thiết kế các không gian cảnh quan như công viên, khu vui chơi.", a: "S" }, { t: "Các nghề nghiệp liên quan đến thiết kế thường đòi hỏi người làm có tư duy không gian tốt và khả năng sử dụng phần mềm đồ hoạ.", a: "Đ" }, { t: "Kiến trúc sư xây dựng là người thiết kế các toà nhà, văn phòng, khu dân cư và lập kế hoạch giám sát thi công.", a: "Đ" }] },
                    { q: "Quy trình thiết kế kĩ thuật là một chu trình phối hợp nhiều hoạt động. Hãy xác định tính Đúng hoặc Sai của các nhận định sau:", sub: [{ t: "Quy trình thiết kế kĩ thuật là một tiến trình có tính lặp đi lặp lại cao; có thể quay lại các bước trước đó để điều chỉnh.", a: "Đ" }, { t: "Bước 'Xác định yêu cầu' (Bước 3) không có mối liên hệ nào với bước 'Kiểm chứng giải pháp' (Bước 6).", a: "S" }, { t: "Việc 'Tìm hiểu tổng quan' (Bước 2) giúp người thiết kế tránh được các sai lầm đã có và thừa hưởng kinh nghiệm thực tiễn.", a: "Đ" }, { t: "Một nguyên mẫu (Prototype) trong bước 5 có thể là một mô hình hoạt động được chế tạo để kiểm tra các tiêu chí.", a: "Đ" }] },
                    { q: "Mỗi giai đoạn trong quy trình thiết kế kĩ thuật đều có những nhiệm vụ cụ thể. Hãy cho biết các phát biểu sau đây là đúng hay sai:", sub: [{ t: "Để 'Xác định vấn đề' chính xác, cần trả lời các câu hỏi như: Vấn đề cần giải quyết là gì? Ai đang gặp vấn đề đó?.", a: "Đ" }, { t: "Trong bước 'Đề xuất, đánh giá và lựa chọn giải pháp', người thiết kế chỉ nên đưa ra một giải pháp duy nhất.", a: "S" }, { t: "Hồ sơ kĩ thuật (lập ở bước 7) bao gồm đầy đủ thông tin về hình dáng, kết cấu, thông số kĩ thuật và quy trình công nghệ.", a: "Đ" }, { t: "'Xây dựng nguyên mẫu cho giải pháp' là bước cuối cùng của quy trình thiết kế kĩ thuật.", a: "S" }] },
                    { q: "Trong thiết kế kĩ thuật, các yếu tố về sản phẩm đóng vai trò quan trọng. Hãy xác định tính Đúng hoặc Sai của các nhận định sau:", sub: [{ t: "Tính thẩm mĩ của sản phẩm chỉ đơn thuần là tạo ra vẻ đẹp bên ngoài mà không cần quan tâm đến sự hài hoà.", a: "S" }, { t: "Yếu tố nhân trắc giúp đảm bảo sản phẩm phù hợp với kích thước cơ thể và tư thế của người sử dụng.", a: "Đ" }, { t: "Trong các quy ước về an toàn, màu đỏ biểu thị sự nguy hiểm, trong khi màu xanh lá cây biểu thị trạng thái an toàn.", a: "Đ" }, { t: "Thiết kế bền vững chỉ cần tập trung vào việc tạo ra sản phẩm bền bỉ mà không cần xem xét tác động môi trường.", a: "S" }] },
                    { q: "Quá trình thiết kế bị chi phối bởi nhiều yếu tố từ tài nguyên đến công nghệ. Hãy cho biết các phát biểu sau đây là đúng hay sai:", sub: [{ t: "Thiết kế sản phẩm hiện đại khuyến khích việc sử dụng tối đa các nguồn năng lượng hoá thạch.", a: "S" }, { t: "Phân tích vòng đời sản phẩm cho phép đánh giá mức tiêu hao năng lượng và vật liệu ở mỗi giai đoạn.", a: "Đ" }, { t: "Tài chính là yếu tố nguồn lực ảnh hưởng đến việc lựa chọn phương án sản xuất và quyết định chất lượng sản phẩm.", a: "Đ" }, { t: "Công nghệ hiện có là cơ sở thực hiện nhưng cũng có thể trở thành ràng buộc nếu ý tưởng vượt quá giới hạn.", a: "Đ" }] },
                    { q: "Các nguyên tắc tối ưu giúp nhà thiết kế tìm ra giải pháp tốt nhất. Hãy xác định tính Đúng hoặc Sai của các nhận định sau:", sub: [{ t: "Nguyên tắc lặp đi lặp lại là một tiến trình tuyến tính một chiều, không bao giờ quay lại các bước đã qua.", a: "S" }, { t: "Nguyên tắc đơn giản hoá yêu cầu hướng tới các giải pháp dễ hiểu, dễ áp dụng thông qua tối giản hình thức.", a: "Đ" }, { t: "Nguyên tắc giải pháp tối ưu chỉ tập trung vào khách hàng mà không cần quan tâm đến ràng buộc công nghệ.", a: "S" }, { t: "Nguyên tắc tối thiểu tài chính có ý nghĩa quan trọng giúp đáp ứng nhiều nhu cầu với chi phí thấp nhất.", a: "Đ" }] },
                    { q: "Thiết kế kĩ thuật hiện đại luôn gắn liền với trách nhiệm bảo vệ môi trường. Hãy cho biết các phát biểu sau đây là đúng hay sai:", sub: [{ t: "Nguyên tắc tiết kiệm tài nguyên khuyến khích ưu tiên sử dụng năng lượng không tái tạo như dầu thô.", a: "S" }, { t: "Việc tính toán sử dụng ít vật liệu nhất mà vẫn đảm bảo độ bền là một nội dung của tiết kiệm tài nguyên.", a: "Đ" }, { t: "Quy tắc 6R (Recycle, Reduce, Rethink, Repair, Reuse, Refuse) là nội dung cốt lõi của bảo vệ môi trường.", a: "Đ" }, { t: "Sản phẩm thiết kế nên sử dụng vật liệu có khả năng tái chế hoặc tự phân hủy để tránh ô nhiễm.", a: "Đ" }] },
                    { q: "Việc tuân thủ các nguyên tắc tối ưu giúp nâng cao chất lượng sản phẩm. Hãy xác định tính Đúng hoặc Sai của các phát biểu sau:", sub: [{ t: "Nguyên tắc lặp đi lặp lại nhằm mục đích xem xét, điều chỉnh và kiểm soát chất lượng ở từng bước.", a: "Đ" }, { t: "Các giai đoạn như đề xuất, đánh giá giải pháp và xây dựng nguyên mẫu thường có tính lặp đi lặp lại cao.", a: "Đ" }, { t: "Nguyên tắc đơn giản hoá khuyến khích nhà thiết kế tạo ra những sản phẩm có hình thức cầu kì, phức tạp.", a: "S" }, { t: "Nghiên cứu tổng quan đầy đủ và phân tích các giải pháp hiện có là cơ sở thực hiện đơn giản hoá.", a: "Đ" }] },
                    { q: "Giải pháp tối ưu và tối thiểu tài chính là những mục tiêu quan trọng. Hãy cho biết các phát biểu sau đây là đúng hay sai:", sub: [{ t: "Giải pháp tối ưu là giải pháp hoàn hảo nhất về mọi mặt mà không bị ràng buộc bởi bất kì yếu tố nào.", a: "S" }, { t: "Nhu cầu của khách hàng và người dùng là một trong những ràng buộc quan trọng nhất khi lựa chọn giải pháp tối ưu.", a: "Đ" }, { t: "Nguyên tắc tối thiểu tài chính cho phép giải quyết nhiều vấn đề hơn trong điều kiện nguồn lực tài chính hữu hạn.", a: "Đ" }, { t: "Áp dụng nguyên tắc tối thiểu tài chính đồng nghĩa với việc luôn phải chọn những vật liệu rẻ tiền nhất.", a: "S" }] },
                    { q: "Tiết kiệm tài nguyên là một phần không thể thiếu của thiết kế bền vững. Hãy xác định tính Đúng hoặc Sai của các nhận định sau:", sub: [{ t: "Mọi vật liệu trong thiết kế kĩ thuật đều xuất phát từ tài nguyên thiên nhiên.", a: "Đ" }, { t: "Nguyên tắc tiết kiệm tài nguyên yêu cầu tính toán sử dụng ít vật liệu nhất mà vẫn đảm bảo độ bền.", a: "Đ" }, { t: "Việc ưu tiên sử dụng các nguồn năng lượng hoá thạch là nội dung chính của tiết kiệm tài nguyên.", a: "S" }, { t: "Phân tích vòng đời sản phẩm giúp kiểm soát được năng lượng và vật liệu tiêu thụ ở từng giai đoạn.", a: "Đ" }] },
                    { q: "Thiết kế vì môi trường đang trở thành xu hướng tất yếu. Hãy cho biết các phát biểu sau đây là đúng hay sai:", sub: [{ t: "Nguyên tắc bảo vệ môi trường yêu cầu sử dụng các loại vật liệu có khả năng tái chế hoặc dễ phân hủy.", a: "Đ" }, { t: "Quy tắc 6R bao gồm: Recycle, Reduce, Rethink, Repair, Reuse và Refuse.", a: "Đ" }, { t: " 'Refuse' (Từ chối) trong quy tắc 6R có nghĩa là từ chối tất cả các giải pháp công nghệ mới.", a: "S" }, { t: "Thiết kế nên hướng tới việc dễ dàng tháo rời các khớp nối để thuận tiện thay thế hoặc tái chế.", a: "Đ" }] },
                    { q: "Hãy đánh giá đúng/sai của các nhận định về các yếu tố ảnh hưởng đến thiết kế kĩ thuật:", sub: [{ t: "Vòng đời sản phẩm bao gồm các giai đoạn: sản xuất, sử dụng và thải loại.", a: "Đ" }, { t: "Các yếu tố ảnh hưởng bao gồm: Thẩm mỹ, nhân trắc, an toàn, vòng đời, phát triển bền vững, công nghệ và tài chính.", a: "Đ" }, { t: "Công nghệ mới phát triển ở trình độ cao có thể giúp nâng cao chất lượng và thân thiện với môi trường.", a: "Đ" }, { t: "Phát triển bền vững là sự phát triển đáp ứng nhu cầu hiện tại mà không làm tổn hại đến thế hệ tương lai.", a: "Đ" }] },
                    { q: "Một nhóm học sinh trao đổi về nội dung nguyên tắc thiết kế kĩ thuật. Hãy xác định đúng sai:", sub: [{ t: "Trong thiết kế kĩ thuật, các nguyên tắc phát triển bền vững gồm có: tiết kiệm tài nguyên và tài chính.", a: "Đ" }, { t: "Thiết kế kĩ thuật là hoạt động đặc thù của các kĩ sư vận dụng toán học, khoa học và công nghệ hiện có.", a: "Đ" }, { t: "Công nghệ sau bao giờ cũng không bằng và có nhiều hạn chế hơn so với công nghệ cùng loại trước đó.", a: "S" }, { t: "Thiết kế kĩ thuật được tiến hành qua các bước bắt đầu với việc xác định vấn đề, kết thúc bằng giải pháp.", a: "Đ" }] },
                    { q: "Hãy đánh giá đúng/sai của các nhận định sau đây về quy trình thiết kế:", sub: [{ t: "Quy trình thiết kế kĩ thuật luôn có thể hoàn thành sau lần kiểm chứng đầu tiên.", a: "S" }, { t: "Nguyên mẫu là phiên bản hoàn chỉnh cuối cùng của sản phẩm thiết kế.", a: "S" }, { t: "Quy trình thiết kế bao gồm 7 bước: Xác định vấn đề; tìm hiểu tổng quan; xác định yêu cầu; lựa chọn giải pháp; xây dựng nguyên mẫu; kiểm chứng; lập hồ sơ.", a: "Đ" }, { t: "Bước “Xác định vấn đề” nhằm làm rõ nhu cầu hoặc khó khăn cần giải quyết.", a: "Đ" }] }
                ]
            },
            11: {
                multiple: [{ question: "Hệ thống nào không có trên động cơ Diesel?", options: ["Hệ thống bôi trơn", "Hệ thống làm mát", "Hệ thống đánh lửa", "Hệ thống khởi động"], answer: 2 }],
                tf: [{ q: "Về hệ thống nhiên liệu, đánh lửa và xử lí khí thải...", sub: [{ t: "Hệ thống phun xăng EFI sử dụng cảm biến và ECU.", a: "Đ" }, { t: "Ở động cơ Diesel, nhiên liệu tự bốc cháy.", a: "Đ" }, { t: "Đánh lửa tạo tia lửa điện.", a: "Đ" }, { t: "EGR giúp giảm khí thải độc hại.", a: "Đ" }] }]
            }
        };

        let state = { grade: 0, type: '', list: [], userAns: {}, isReview: false, timer: null, timeLeft: 1500, isMockExam: false };

        function selectGrade(g) {
            state.grade = g;
            document.getElementById('grade-display').innerText = `CÔNG NGHỆ ${g}`;
            const options = document.getElementById('type-options');
            options.innerHTML = `
                <button onclick="prepareQuiz('multiple')" class="btn-tech glass p-8 rounded-2xl text-xl font-bold">Trắc nghiệm 1 đáp án</button>
                <button onclick="prepareQuiz('tf')" class="btn-tech glass p-8 rounded-2xl text-xl font-bold">Trắc nghiệm Đúng/Sai</button>
            `;
            if(g === 11) options.innerHTML += `<button onclick="prepareMockExam()" class="btn-tech glass p-8 rounded-2xl text-xl font-bold bg-sky-600/20 border-sky-400">THI THỬ (7 điểm)</button>`;
            goScreen(2);
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function cleanText(text) { return text.replace(/^Câu \d+:\s*/i, "").trim(); }

        function prepareQuiz(type) {
            state.type = type; state.isReview = false; state.userAns = {}; state.isMockExam = false;
            let data = JSON.parse(JSON.stringify(questionsDB[state.grade][type]));
            state.list = shuffle(data);
            // TRỘN CÁC Ý ĐÚNG SAI (SUB)
            if(type === 'tf') {
                state.list.forEach(q => { q.sub = shuffle(q.sub); });
            }
            goScreen(3); render(); startTimer();
        }

        function render() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            state.list.forEach((q, idx) => {
                const qType = q.originalType || state.type;
                const div = document.createElement('div');
                div.className = "glass p-6 rounded-2xl border-l-4 border-transparent hover:border-sky-500 transition-all";
                
                if (qType === 'tf') {
                    div.innerHTML = `<p class="text-sky-100 font-bold mb-4 text-lg"><span class="text-sky-400 mr-2 font-tech">Câu ${idx+1}:</span>${cleanText(q.q)}</p>`;
                    q.sub.forEach((s, sIdx) => {
                        const subId = `${idx}_${sIdx}`;
                        const userChoice = state.userAns[subId];
                        let btnD = "border-white/10", btnS = "border-white/10";
                        if (state.isReview) {
                            btnD = s.a === "Đ" ? "correct-tf" : (userChoice === "Đ" ? "wrong-tf" : "opacity-30");
                            btnS = s.a === "S" ? "correct-tf" : (userChoice === "S" ? "wrong-tf" : "opacity-30");
                        } else if(userChoice === "Đ") btnD = "active-tf"; else if(userChoice === "S") btnS = "active-tf";
                        div.innerHTML += `
                            <div class="flex flex-col md:flex-row md:items-center justify-between p-4 border-b border-white/5 last:border-0 gap-3">
                                <span class="flex-1 text-sm">${String.fromCharCode(97+sIdx)}) ${s.t}</span>
                                <div class="flex gap-2">
                                    <button onclick="pickTF('${subId}', 'Đ')" class="w-20 py-2 rounded-lg border font-bold text-xs ${btnD}" ${state.isReview?'disabled':''}>ĐÚNG</button>
                                    <button onclick="pickTF('${subId}', 'S')" class="w-20 py-2 rounded-lg border font-bold text-xs ${btnS}" ${state.isReview?'disabled':''}>SAI</button>
                                </div>
                            </div>`;
                    });
                } else {
                    div.innerHTML = `<p class="text-sky-100 font-bold mb-4 text-lg"><span class="text-sky-400 mr-2 font-tech">Câu ${idx+1}:</span>${cleanText(q.question)}</p>
                        <div class="grid grid-cols-1 gap-3">
                            ${q.options.map((opt, i) => {
                                let cls = "border-white/10";
                                if(state.isReview) {
                                    if(i === q.answer) cls = "bg-emerald-600 border-emerald-500 text-white";
                                    else if(state.userAns[idx] === i) cls = "bg-red-600 border-red-500 text-white";
                                } else if(state.userAns[idx] === i) cls = "selected-mc";
                                return `<button onclick="pickMC(${idx}, ${i})" class="p-4 border rounded-xl text-left text-sm flex items-start ${cls}" ${state.isReview?'disabled':''}>
                                    <span class="font-bold mr-3 text-sky-500">${String.fromCharCode(65+i)}.</span> <span>${opt}</span>
                                </button>`;
                            }).join('')}
                        </div>`;
                }
                container.appendChild(div);
            });
        }

        function pickMC(qIdx, oIdx) { state.userAns[qIdx] = oIdx; render(); }
        function pickTF(id, val) { state.userAns[id] = val; render(); }
        function confirmSubmit() { if(confirm("Nộp bài?")) submit(); }

        function submit() {
            clearInterval(state.timer);
            document.getElementById('timer-container').classList.add('hidden');
            let score = 0; let correctCount = 0;
            state.list.forEach((q, idx) => {
                const qType = q.originalType || state.type;
                if(qType === 'tf') {
                    q.sub.forEach((s, si) => { if(state.userAns[`${idx}_${si}`] === s.a) { score += 0.25; correctCount++; } });
                } else {
                    if(state.userAns[idx] === q.answer) { score += 0.25; correctCount++; }
                }
            });
            document.getElementById('score-text').innerText = score.toFixed(2);
            document.getElementById('detail-text').innerText = `Đúng ${correctCount} câu/ý (x 0.25đ)`;
            goScreen(4); window.scrollTo(0,0);
        }

        function startTimer() {
            clearInterval(state.timer); state.timeLeft = 1500; updateTimerDisplay();
            document.getElementById('timer-container').classList.remove('hidden');
            state.timer = setInterval(() => {
                state.timeLeft--; updateTimerDisplay();
                if (state.timeLeft <= 0) { clearInterval(state.timer); submit(); }
            }, 1000);
        }

        function updateTimerDisplay() {
            const min = Math.floor(state.timeLeft / 60); const sec = state.timeLeft % 60;
            const display = document.getElementById('timer-display');
            display.innerText = `${min}:${sec < 10 ? '0' : ''}${sec}`;
            if (state.timeLeft < 300) display.classList.add('low-time');
        }

        function showReview() { state.isReview = true; goScreen(3); render(); window.scrollTo(0,0); }
        function goScreen(id) {
            document.querySelectorAll('[id^="screen-"]').forEach(s => s.classList.add('hidden'));
            document.getElementById(`screen-${id}`).classList.remove('hidden');
        }
    </script>
</body>
</html>
