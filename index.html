<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Nội dung Cá nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .topic-card { transition: all 0.3s ease; }
        .topic-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-indigo-700 text-white shadow-lg p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fas fa-database"></i> My Knowledge CMS
            </h1>
            <button onclick="toggleModal()" class="bg-green-500 hover:bg-green-600 px-4 py-2 rounded-lg font-bold transition">
                <i class="fas fa-plus"></i> Thêm Tài Liệu
            </button>
        </div>
    </header>

    <main class="container mx-auto py-8 px-4">
        <div class="flex flex-wrap gap-4 mb-8 justify-center">
            <button onclick="filterContent('all')" class="bg-gray-200 hover:bg-indigo-100 px-6 py-2 rounded-full font-medium active">Tất cả</button>
            <button onclick="filterContent('English')" class="bg-blue-100 text-blue-700 px-6 py-2 rounded-full font-medium">Tiếng Anh</button>
            <button onclick="filterContent('Programming')" class="bg-green-100 text-green-700 px-6 py-2 rounded-full font-medium">Lập trình</button>
            <button onclick="filterContent('Teaching')" class="bg-yellow-100 text-yellow-700 px-6 py-2 rounded-full font-medium">Dạy học</button>
            <button onclick="filterContent('Finance')" class="bg-purple-100 text-purple-700 px-6 py-2 rounded-full font-medium">Tài chính</button>
        </div>

        <div id="contentGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="p-6">
                <h2 class="text-xl font-bold mb-4">Thêm tài liệu mới</h2>
                <form id="cmsForm">
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-1">Tiêu đề</label>
                        <input type="text" id="title" required class="w-full border p-2 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-1">Chủ đề</label>
                        <select id="topic" class="w-full border p-2 rounded-md">
                            <option value="English">Tiếng Anh</option>
                            <option value="Programming">Lập trình</option>
                            <option value="Teaching">Dạy học</option>
                            <option value="Finance">Tài chính</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-1">Nội dung / Link tài liệu</label>
                        <textarea id="body" rows="4" required class="w-full border p-2 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Nhập nội dung hoặc dán URL..."></textarea>
                    </div>
                    <div class="flex justify-end gap-3">
                        <button type="button" onclick="toggleModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-md">Hủy</button>
                        <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Lưu lại</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let contents = JSON.parse(localStorage.getItem('my_cms_data')) || [];

        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.classList.toggle('hidden');
            document.getElementById('cmsForm').reset();
        }

        document.getElementById('cmsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newItem = {
                id: Date.now(),
                title: document.getElementById('title').value,
                topic: document.getElementById('topic').value,
                body: document.getElementById('body').value,
                date: new Date().toLocaleDateString('vi-VN')
            };
            contents.unshift(newItem);
            saveAndRender();
            toggleModal();
        });

        function deleteItem(id) {
            if(confirm('Bạn có chắc muốn xóa tài liệu này?')) {
                contents = contents.filter(item => item.id !== id);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('my_cms_data', JSON.stringify(contents));
            render();
        }

        function render(data = contents) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = data.map(item => `
                <div class="topic-card bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold uppercase px-2 py-1 rounded ${getTopicClass(item.topic)}">${item.topic}</span>
                            <button onclick="deleteItem(${item.id})" class="text-gray-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
                        </div>
                        <h3 class="font-bold text-lg mb-2 text-indigo-900">${item.title}</h3>
                        <p class="text-gray-600 text-sm whitespace-pre-line">${item.body}</p>
                    </div>
                    <div class="mt-4 pt-4 border-t text-xs text-gray-400 flex justify-between">
                        <span><i class="far fa-calendar-alt"></i> ${item.date}</span>
                        <span class="font-medium cursor-pointer text-indigo-600 hover:underline">Xem chi tiết →</span>
                    </div>
                </div>
            `).join('');
        }

        function getTopicClass(topic) {
            switch(topic) {
                case 'English': return 'bg-blue-100 text-blue-600';
                case 'Programming': return 'bg-green-100 text-green-600';
                case 'Teaching': return 'bg-yellow-100 text-yellow-600';
                case 'Finance': return 'bg-purple-100 text-purple-600';
                default: return 'bg-gray-100';
            }
        }

        function filterContent(topic) {
            if(topic === 'all') render(contents);
            else {
                const filtered = contents.filter(item => item.topic === topic);
                render(filtered);
            }
        }

        // Khởi tạo hiển thị lần đầu
        render();
    </script>
</body>
</html>
